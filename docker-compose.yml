services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_PATH: /data/meetings.db
    volumes:
      - meeting-data:/data
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  meeting-data:
